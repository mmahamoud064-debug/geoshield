[project]
name = "geoshield-backend"
version = "0.1.0"
description = "GeoShield cybersecurity dashboard backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.0,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["demo", "demo.*", "tests", "tests.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["web/*.html", "web/static/*"]
